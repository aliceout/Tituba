name: Docker build

# CI de Tituba — push main → test → build images Docker → push GHCR.
# Le déclenchement du deploy côté VPS se fait via le webhook GitHub
# natif configuré dans Settings → Webhooks (event « package » ou
# « workflow_run »), pas dans ce workflow. Référence : 2mains/.github/
# workflows/docker-build.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Force toutes les actions JavaScript déclarant `node20` à tourner sur
# le runtime Node 24 du runner. Workaround officiel GitHub pour la
# transition node20 → node24 (déprécié juin 2026, retiré sept. 2026).
# Cf https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ─── Test : type-check + tests + build smoke-test ──────────────
  # Tourne sur push ET PR. Les jobs build / deploy sont gated sur
  # push main only via leur `if`.
  #
  # Pipeline (failfast — premier step en erreur stoppe le job) :
  #   1. Lint frontend    (eslint flat config — Astro + TS)
  #   2. Lint backend     (eslint flat config — Payload TS + react-hooks)
  #   3. Astro check      (type-check des .astro + TS frontend)
  #   4. Payload tests    (node --test, sans dépendance DB)
  #   5. Astro build SSR  (smoke build + check du bundle)
  #
  # Références : issues #24 (CI tests) et #25 (lint réparé, configs
  # passées à typescript-eslint flat — eslint-config-next a un bug
  # circulaire avec ESLint v9 cf. vercel/next.js#68334).
  test:
    name: Lint + type check + tests + build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pas de `version:` ici — la version pnpm est portée par le champ
      # `packageManager` dans package.json (pnpm@10.33.0). Spécifier les
      # deux fait planter l'action avec ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Le monorepo n'utilise pas pnpm workspaces — services/payload a
      # son propre package.json + lockfile. On installe les deux côtés.
      - name: Install root dependencies (Astro)
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies (Payload)
        run: pnpm --dir services/payload install --frozen-lockfile

      - name: Lint frontend (Astro)
        run: pnpm lint

      - name: Lint backend (Payload)
        run: pnpm --dir services/payload lint

      - name: Type check (Astro)
        run: pnpm check

      # PAYLOAD_SECRET sentinelle pour les tests Payload — auth.test.ts
      # pose un fallback en interne, mais on l'expose ici aussi pour
      # tout module qui pourrait le checker au top-level. Aucune valeur
      # sensible : c'est un secret de test fixé, jamais utilisé en prod.
      # Les huit cas du front ne tournaient nulle part : il n'y avait pas
      # de script `test` à la racine, et donc aucune étape ici. Un test
      # qu'aucune machine ne lance ne protège de rien.
      - name: Test frontend (Astro, node --test)
        run: pnpm test

      - name: Test backend (Payload, node --test)
        env:
          PAYLOAD_SECRET: ci-test-secret-not-sensitive-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: pnpm --dir services/payload test

      - name: Build (Astro Node SSR)
        run: pnpm build

      # SSR mode : on vérifie que le bundle Node a bien été produit.
      - name: Smoke test — SSR bundle exists
        run: |
          test -f dist/server/entry.mjs
          test -d dist/client
          echo "SSR bundle present."

  # ─── Build & push image site (Astro) ───────────────────────────
  build-web:
    name: Build & push web image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 pour que `git describe --tags` voit l'historique
      # complet (sinon shallow clone et pas de tags).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Aucun secret à récupérer avant de construire ────────
      # Plus rien à récupérer avant de construire : l'image ne connaît
      # pas le domaine qu'elle servira. Trois étapes vivaient ici —
      # détection du coffre, lecture Infisical, repli sur un secret
      # GitHub — et leur seul objet était de trouver ADDRESS pour le
      # passer en --build-arg. Le site lit désormais cette adresse dans
      # l'environnement du conteneur, au moment de répondre
      # (cf. src/lib/adresse.ts), si bien que la construction du site
      # n'a plus besoin d'aucun secret.
      #
      # C'est ce qui bloquait la première mise en ligne : Infisical ne
      # répondait pas, donc la CI ne pouvait pas construire — alors que
      # la construction n'avait, au fond, aucune raison de dépendre du
      # domaine.
      - name: Compute version info
        id: version
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.site
          # GIT_COMMIT / GIT_TAG affichés dans le pied de page du site.
          # Reçus en ARG par le stage `builder` du Dockerfile. Ce sont
          # les deux seules choses que l'image a besoin de savoir au
          # moment où on la fabrique.
          build-args: |
            GIT_COMMIT=${{ steps.version.outputs.commit }}
            GIT_TAG=${{ steps.version.outputs.tag }}
          push: true
          tags: |
            ghcr.io/aliceout/tituba/web:latest
            ghcr.io/aliceout/tituba/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ─── Build & push image Payload (CMS) ──────────────────────────
  build-payload:
    name: Build & push payload image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 pour `git describe --tags` (cf. job build-web).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version info
        id: version
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push payload
        uses: docker/build-push-action@v6
        with:
          context: services/payload
          file: services/payload/Dockerfile
          # GIT_COMMIT / GIT_TAG affichés dans la page Site (Payload admin).
          build-args: |
            GIT_COMMIT=${{ steps.version.outputs.commit }}
            GIT_TAG=${{ steps.version.outputs.tag }}
          push: true
          tags: |
            ghcr.io/aliceout/tituba/payload:latest
            ghcr.io/aliceout/tituba/payload:${{ github.sha }}
          cache-from: type=gha,scope=payload
          cache-to: type=gha,scope=payload,mode=max
